<script>
    const val = Number(prompt('Digite o valor da pizza: '))
    const cli = Number(prompt('Número de cliente: '))
    const valc = (val / cli)
    alert(`Valor de Conta R$: ${val}\nNúmero de Clientes: ${cli}\nValor por Cliente R$: ${valc}`)
    console.log(`Valor de Conta R$: ${val}\nNúmero de Clientes: ${cli}\nValor por Cliente R$: ${valc}`)
</script>
