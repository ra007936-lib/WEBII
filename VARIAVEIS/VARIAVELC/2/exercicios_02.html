<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programa Criação de Chinchilas</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-4">
                <img src="imagens/exerc.jpg" alt="Criação de Chinchilas">
            </div>
            <div class="col-8">
                <h1>Programa Criação de Chinchilas</h1>
                <hr>
                <form action="">
                    <p>N° Chinchilas:
                        <input type="number" id="inChinchilas" min="2" required>
                    </p>
                    <p>N° Anos:
                        <input type="number" id="inAnos" required>
                    </p>
                     <input type="submit" value="Mostrar Previsão de Chinchilas">
                </form>
                <p>&nbsp;</p>
                <pre style="font-size: 1.2em;font-weight:bold;"></pre>
            </div>
        </div>
    </div>
    <script src="js/ex02.js"></script>
</body>
</html>
